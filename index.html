<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>羽毛球姿势教练</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0b1220; --surface:#131c2e; --surface-2:#1b2740;
    --line:#26334d; --text:#eaf1fb; --muted:#8ea0bd;
    --primary:#0d9488; --primary-press:#0b7f74;
    --ok:#22c55e; --warn:#f59e0b;
    --r-lg:18px; --r-md:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100dvh;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column}
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:0 14px 28px;flex:1;
    display:flex;flex-direction:column;gap:14px}

  /* 1. 顶部标题：只说明这是什么、怎么用 */
  .title{padding:16px 2px 0}
  .title h1{font-size:20px;letter-spacing:.5px}
  .title p{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}

  /* 2. 唯一的视觉主体：取景 / 结果画面 */
  .stage{position:relative;background:#000;border-radius:var(--r-lg);
    overflow:hidden;aspect-ratio:3/4;border:1px solid var(--line)}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage .idle{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;color:var(--muted);
    font-size:14px;text-align:center;padding:24px;background:var(--surface)}
  .stage .idle svg{opacity:.55}
  .stage video,.stage canvas{display:none}
  .stage.showVideo video{display:block}
  .stage.showResult canvas{display:block}
  .badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);
    color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;display:none}
  .stage.showVideo .badge,.stage.showResult .badge{display:block}

  /* 3. 主操作按钮：同一时刻只出现一个，动词开头 */
  .primary{width:100%;padding:18px;border:0;border-radius:var(--r-lg);
    background:var(--primary);color:#fff;font-size:17px;font-weight:600}
  .primary:active{background:var(--primary-press)}
  .primary[hidden]{display:none}

  /* 4. 次级操作：弱化的文字按钮，不抢主按钮 */
  .secondary{width:100%;padding:12px;border:0;background:none;
    color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
  .secondary[hidden]{display:none}

  .status{font-size:13px;color:var(--muted);line-height:1.5;text-align:center;min-height:20px}

  /* 5. 结果区：分析完成后才出现，内部再分层：评分 → 建议 */
  .result{display:none;flex-direction:column;gap:12px}
  .result.show{display:flex}
  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:14px}
  .card h2{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:10px;
    display:flex;align-items:center;gap:6px}
  .score{font-size:34px;font-weight:700;line-height:1}
  .score small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
  .gauge{height:6px;background:var(--surface-2);border-radius:999px;margin:12px 0 10px;overflow:hidden}
  .gauge i{display:block;height:100%;border-radius:999px;transition:width .3s}
  .items{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;gap:10px;align-items:flex-start}
  .item .dot{width:22px;height:22px;border-radius:50%;flex:0 0 22px;
    display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}
  .dot.ok{background:rgba(34,197,94,.16);color:var(--ok)}
  .dot.bad{background:rgba(245,158,11,.16);color:var(--warn)}
  .item .body{flex:1}
  .item .name{font-size:15px;font-weight:600}
  .item .name span{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
  .item .desc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:3px}
  .fileInput{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- 标题 -->
  <div class="title">
    <h1>羽毛球姿势教练</h1>
    <p>三步就够：开启相机 → 拍下这一拍 → 看改进建议。画面只在本机处理。</p>
  </div>

  <!-- 取景 / 结果 -->
  <div class="stage" id="stage">
    <div class="idle" id="idle">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
      </svg>
      点击下方按钮开始<br>光线充足、离远一点更容易识别
    </div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="badge" id="badge"></div>
  </div>

  <!-- 主按钮：拍照分析 / 重新拍摄 -->
  <button class="primary" id="btnMain">拍照分析</button>
  <!-- 次按钮：用相册照片 -->
  <button class="secondary" id="btnGallery">改从相册选照片</button>
  <input type="file" class="fileInput" id="file" accept="image/*">

  <div class="status" id="status">正在加载 AI 模型…</div>

  <!-- 结果区：评分 + 逐条建议 -->
  <div class="result" id="result">
    <div class="card">
      <h2>动作评分</h2>
      <div class="score" id="score">—<small>共 5 项</small></div>
      <div class="gauge"><i id="gauge" style="width:0;background:var(--ok)"></i></div>
      <div class="status" id="summary" style="text-align:left"></div>
    </div>
    <div class="card">
      <h2>逐项点评与建议</h2>
      <div class="items" id="items"></div>
    </div>
  </div>

</div>

<script type="module">
/* ---------- 依赖：MediaPipe Pose ---------- */
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const stage = $("stage"), idle = $("idle"), video = $("video"), canvas = $("canvas"),
      badge = $("badge"), ctx = canvas.getContext("2d"),
      btnMain = $("btnMain"), btnGallery = $("btnGallery"), fileInput = $("file"),
      statusEl = $("status"), resultEl = $("result"), scoreEl = $("score"),
      gaugeEl = $("gauge"), summaryEl = $("summary"), itemsEl = $("items");

/* 界面状态：idle → aiming → done，决定按钮文案与可见性 */
const UI = {
  idle:   () => { stage.className = "stage";         btnMain.textContent = "拍照分析";  btnGallery.hidden = false; },
  aiming: () => { stage.className = "stage showVideo"; btnMain.textContent = "拍下这一拍"; btnGallery.hidden = true;  badge.textContent = "取景中"; },
  done:   () => { stage.className = "stage showResult"; btnMain.textContent = "重新拍摄";  btnGallery.hidden = false;  badge.textContent = "分析结果"; },
};

/* ---------- 初始化模型（GPU 优先，失败回退 CPU） ---------- */
statusEl.textContent = "正在加载 AI 模型（首次约需 5–10 秒）…";
const vision = await FilesetResolver.forVisionTasks(`${CDN}/wasm`);
const options = mode => ({
  baseOptions: { modelAssetPath: MODEL, delegate: mode },
  runningMode: "IMAGE", numPoses: 1,
});
let landmarker;
try { landmarker = await PoseLandmarker.createFromOptions(vision, options("GPU")); }
catch {  landmarker = await PoseLandmarker.createFromOptions(vision, options("CPU")); }
statusEl.textContent = "模型就绪，点击下方按钮开始。";

/* ---------- 相机 ---------- */
let stream = null;
async function openCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 960 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
  UI.aiming();
}
function closeCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
}

/* ---------- 主按钮：一个按钮串起整个流程 ---------- */
let UI_state = "idle";
function setState(s) { UI_state = s; UI[s](); }
setState("idle");

btnMain.onclick = async () => {
  if (UI_state === "idle") {                       // 第 1 步：开相机
    try { await openCamera(); setState("aiming"); statusEl.textContent = "对准动作后点「拍下这一拍」。"; }
    catch (e) { statusEl.textContent = "打不开相机：" + e.message + "。请在浏览器地址栏左侧允许摄像头权限。"; }
    return;
  }
  if (UI_state === "aiming") {                     // 第 2 步：抓拍并分析
    copyVideoToCanvas();
    closeCamera();
    analyze();
    return;
  }
  // 第 3 步：重拍
  resultEl.classList.remove("show");
  fileInput.value = "";
  setState("idle");
  statusEl.textContent = "再拍一张，或从相册选一张照片。";
};

/* 次按钮：相册照片 */
btnGallery.onclick = () => fileInput.click();
fileInput.onchange = () => {
  const f = fileInput.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    closeCamera();
    const scale = Math.min(1, 1280 / img.naturalWidth);
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    analyze();
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

function copyVideoToCanvas() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
}

/* ---------- 分析：几何工具 ---------- */
// 关键点归一化坐标需按画布宽高比缩放 x，否则角度会被拉伸
const toPoint = lm => i => ({ x: lm[i].x * (canvas.width / canvas.height), y: lm[i].y });
function angleAt(a, b, c) {
  const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
  const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);
  if (!m) return 180;
  return Math.acos(Math.min(1, Math.max(-1, (v1.x * v2.x + v1.y * v2.y) / m))) * 180 / Math.PI;
}
// MediaPipe Pose 索引
const J = { L_SH:11, R_SH:12, L_EL:13, R_EL:14, L_WR:15, R_WR:16,
            L_HIP:23, R_HIP:24, L_KN:25, R_KN:26, L_AN:27, R_AN:28 };

function analyze() {
  statusEl.textContent = "正在识别姿势…";
  const res = landmarker.detect(canvas);
  const lm = res.landmarks?.[0];
  if (!lm) {
    setState("idle");
    statusEl.textContent = "没有检测到人。请退后一点，让头、手臂和腿都进入画面后重拍。";
    return;
  }
  // 画出骨骼
  const utils = new DrawingUtils(ctx);
  utils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#2dd4bf", lineWidth: 3 });
  utils.drawLandmarks(lm, { color: "#facc15", lineWidth: 1, radius: 4 });

  setState("done");
  render(pickSide(toPoint(lm)));
  statusEl.textContent = "分析完成，共 33 个关键点。";
}

/* 判断持拍侧：手腕抬高且手臂较直的一侧 */
function pickSide(pt) {
  const hitA = angleAt(pt(J.R_SH), pt(J.R_EL), pt(J.R_WR));
  const hitB = angleAt(pt(J.L_SH), pt(J.L_EL), pt(J.L_WR));
  const raised = { R: pt(J.R_WR).y < pt(J.R_SH).y, L: pt(J.L_WR).y < pt(J.L_SH).y };
  let side = raised.R && hitA >= 120 ? "R" : raised.L && hitB >= 120 ? "L" : null;
  if (!side) side = pt(J.R_WR).y <= pt(J.L_WR).y ? "R" : "L";   // 兜底：手更高的一侧
  const S = side === "R"
    ? { SH:J.R_SH, EL:J.R_EL, WR:J.R_WR, HIP:J.R_HIP, KN:J.R_KN, AN:J.R_AN, FSH:J.L_SH, FWR:J.L_WR }
    : { SH:J.L_SH, EL:J.L_EL, WR:J.L_WR, HIP:J.L_HIP, KN:J.L_KN, AN:J.L_AN, FSH:J.R_SH, FWR:J.R_WR };
  return { pt, ...S };
}

/* 五项评估 */
function evaluate({ pt, SH, EL, WR, HIP, KN, AN, FSH, FWR }) {
  const elbow = Math.round(angleAt(pt(SH), pt(EL), pt(WR)));
  const knee  = Math.round(angleAt(pt(HIP), pt(KN), pt(AN)));
  const torso = Math.round(Math.abs(Math.atan2(pt(SH).x - pt(HIP).x, pt(HIP).y - pt(SH).y) * 180 / Math.PI));
  const highHit = pt(WR).y < pt(SH).y;
  const freeUp  = pt(FWR).y < pt(FSH).y;

  return [
    { ok: elbow >= 120, name: "挥拍手臂", value: `肘 ${elbow}°`,
      good: "手臂舒展，击球点高，发力顺畅。",
      tip: `肘关节只有 ${elbow}°，过于弯曲会丢力量。引拍时大臂带动小臂，出手瞬间接近伸直（130°–170°），像鞭子一样甩出去。` },
    { ok: highHit, name: "击球点高度", value: highHit ? "肩上" : "肩下",
      good: "击球点在肩部上方，压制性不错。",
      tip: "击球点低于肩部容易被动。先脚步到位，把球让到身体前上方，手臂上举在最高点击球。" },
    { ok: knee <= 160, name: "下肢与重心", value: `膝 ${knee}°`,
      good: knee <= 140 ? "屈膝充分，重心稳，便于启动回位。" : "膝盖有弯曲，基本合理。",
      tip: `膝关节 ${knee}°，几乎站直。持拍腿侧前弓、屈膝到 100°–140°，重心压住，击球后蹬地回位。` },
    { ok: torso <= 25, name: "躯干姿态", value: `倾斜 ${torso}°`,
      good: "躯干正直，平衡控制好。",
      tip: `躯干倾斜 ${torso}°，过大容易失平衡。注意收腹含胸，用腰腹转体发力，而不是把身体倒出去。` },
    { ok: freeUp, name: "非持拍手", value: freeUp ? "上举" : "偏低",
      good: "非持拍手上举，帮助瞄准与平衡。",
      tip: "非持拍手放低了。抬起来指向来球，能帮你侧肩转体、定位球路，并在击球后保持平衡。" },
  ];
}

/* 渲染结果 */
function render(args) {
  const list = evaluate(args);
  const pass = list.filter(i => i.ok).length;
  scoreEl.innerHTML = `${pass}/5<small>项达标</small>`;
  gaugeEl.style.width = `${pass / 5 * 100}%`;
  gaugeEl.style.background = pass >= 4 ? "var(--ok)" : pass >= 3 ? "var(--warn)" : "#ef4444";

  const bad = list.filter(i => !i.ok).map(i => i.name);
  summaryEl.textContent = bad.length
    ? `最该改的是：${bad.slice(0, 2).join(" 和 ")}。`
    : "整体动作规范，保持住这个击球框架。";

  itemsEl.innerHTML = list.map(i => `
    <div class="item">
      <div class="dot ${i.ok ? "ok" : "bad"}">${i.ok ? "✓" : "!"}</div>
      <div class="body">
        <div class="name">${i.name}<span>${i.value}</span></div>
        <div class="desc">${i.ok ? i.good : i.tip}</div>
      </div>
    </div>`).join("");
  resultEl.classList.add("show");
}

/* ---------- PWA：离线缓存应用外壳 ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
